<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<title>Applications — LifeCasts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="lc-pages.css">
<script src="lc-common.js?v=6"></script>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="index.html"><img src="mark-dark.png" height="34" alt="">LifeCasts</a>
<nav><a href="index.html">Accueil</a><a href="applications.html" class="on">Applications</a><a href="system.html">LifeCasts System</a><a href="admin.html">Administration</a></nav>
</div></header>

<div class="hero"><div class="wrap">
<div class="eyebrow" id="hEye">Applications</div>
<h1 id="hTitle">La famille d'applications LifeCasts</h1>
<p id="hDesc">Toutes nos applications, leurs nouveautés et l'historique de leurs versions.</p>
</div></div>

<main><div class="wrap" id="main"><p class="muted">Chargement…</p></div></main>
<footer>© <span id="y"></span> LifeCasts · <a href="confidentialite.html">Confidentialité</a> · <a href="conditions.html">Conditions d'utilisation</a></footer>

<script>
$("y").textContent=new Date().getFullYear();
const DEF={bible:{nom:"Bible LifeCasts",description:"La Parole, partout. Même hors connexion.",ordre:1},cantiques:{nom:"Cantiques",description:"Les chants d'autrefois, dans votre poche.",ordre:2}};
const id=new URLSearchParams(location.search).get("id");
(async()=>{
  let db=null;try{db=await fbInit(false)}catch(e){}
  if(!id){
    let qs={docs:[]};try{if(db)qs=await db.collection("apps").get()}catch(e){}
    const apps=qs.docs.map(d=>({id:d.id,...d.data()}));
    Object.keys(REPOS).forEach(i=>{if(!apps.some(x=>x.id===i))apps.push({id:i,...DEF[i]})});
    apps.sort((a,b)=>(a.ordre||0)-(b.ordre||0));
    await Promise.all(apps.map(async a=>{const r=a.repo||REPOS[a.id];a.latest=null;if(r)try{a.latest=(await ghVersions(r))[0]||null;a.dl=await ghDownloads(r)}catch(e){}}));
    $("main").innerHTML=apps.length?'<div class="cards">'+apps.map(a=>`<div class="card">
      <h3>${esc(a.nom)}</h3><p>${esc(a.description)}</p>
      <div>${a.latest?`<span class="tag">Version ${esc(a.latest.version)}</span> <span class="muted">· ${a.latest.date?fdate(a.latest.date):""}</span>`:'<span class="tag old">Bientôt</span>'}</div>
      ${(a.dl||[]).length?`<div style="display:flex;flex-wrap:wrap;gap:8px">${a.dl.map(x=>`<a class="pill accent small" href="${esc(x.url)}" download>${esc(x.label)}</a>`).join("")}</div>`:""}
      <a class="muted" href="applications.html?id=${encodeURIComponent(a.id)}">Voir la fiche et les versions →</a></div>`).join("")+'</div>':'<p class="muted">Aucune application publiée pour l\'instant.</p>';
    return;
  }
  let d=null;try{if(db)d=await db.collection("apps").doc(id).get()}catch(e){}
  const a=d&&d.exists?d.data():DEF[id];
  if(!a){$("main").innerHTML='<p class="muted">Application introuvable. <a href="applications.html">Retour</a></p>';return}
  document.title=a.nom+" — LifeCasts";
  $("hEye").textContent="Application";$("hTitle").textContent=a.nom;$("hDesc").textContent=a.description||"";
  let vs=[];const repo=a.repo||REPOS[id];
  if(repo)try{vs=await ghVersions(repo)}catch(e){}
  vs.sort((x,y)=>vcmp(y.version,x.version));
  let dl=[];if(repo)try{dl=await ghDownloads(repo)}catch(e){}
  const L=vs[0],old=vs.filter(v=>!L||v.version!==L.version);
  $("main").innerHTML=`
  <p style="margin-bottom:20px"><a href="applications.html" class="muted">← Toutes les applications</a></p>
  ${a.details?`<section class="box"><h2>À propos</h2><p>${nl(a.details)}</p>${a.web?`<p style="margin-top:14px"><a class="pill" href="${esc(a.web)}">Ouvrir la version web</a></p>`:""}</section>`:(a.web?`<section class="box"><a class="pill" href="${esc(a.web)}">Ouvrir la version web</a></section>`:"")}
  ${dl.length?`<section class="box"><h2>Télécharger</h2><div style="display:flex;flex-wrap:wrap;gap:10px">${dl.map(x=>`<a class="pill accent" href="${esc(x.url)}" download>${esc(x.label)} · v${esc(x.tag.replace(/^v/,""))}</a>`).join("")}</div><p class="muted" style="margin-top:10px">Fichiers hébergés sur GitHub. Sur Android, autorisez l&#39;installation depuis le navigateur si demandé.</p></section>`:""}
  <section class="box"><h2>Mise à jour actuelle</h2>${L?`
    <div class="row" style="flex-wrap:wrap"><div><span class="tag">Version ${esc(L.version)}</span> <span class="muted">· ${L.date?"publiée le "+fdate(L.date):""}</span></div></div>
    <p style="margin-top:12px">${nl(L.notes||"")}</p>
    <p class="muted" style="margin-top:12px">Les applications installées se mettent à jour automatiquement dès qu'elles sont connectées à Internet.</p>`:'<p class="muted">Aucune mise à jour publiée.</p>'}</section>
  <section class="box"><h2>Anciennes versions</h2>${old.length?'<ul class="vlist">'+old.map(v=>`<li><b>Version ${esc(v.version)}</b><span class="muted">${fdate(v.date)}</span><span class="tag old">Archivée</span><div class="notes">${nl(v.notes||"")}</div></li>`).join("")+'</ul>':'<p class="muted">Pas encore d\'historique.</p>'}</section>`;
})().catch(e=>{$("main").innerHTML='<p class="muted">Erreur de chargement : '+esc(e.message)+'</p>'});
</script>
</body>
</html>
